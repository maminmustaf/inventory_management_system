<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Admin Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container">
        <h1>Inventory Admin Portal</h1>
        <p class="subtitle">Simple Flask REST API + Open Food Facts</p>

        <section class="card">
            <h2>Add Inventory Item</h2>

            <form id="add-form">
                <input id="product_name" placeholder="Product name" required>
                <input id="brands" placeholder="Brand">
                <input id="price" type="number" step="0.01" placeholder="Price" required>
                <input id="stock" type="number" placeholder="Stock" required>
                <input id="barcode" placeholder="Barcode">
                <input id="ingredients_text" placeholder="Ingredients">
                <button type="submit">Add Item</button>
            </form>

            <p id="message"></p>
        </section>

        <section class="card">
            <h2>Find Product on Open Food Facts</h2>

            <div class="search-row">
                <input id="external-barcode" placeholder="Barcode">
                <button onclick="findByBarcode()">Search Barcode</button>
            </div>

            <div class="search-row">
                <input id="external-name" placeholder="Product name">
                <button onclick="findByName()">Search Name</button>
            </div>

            <pre id="external-result">Search results will appear here.</pre>
        </section>

        <section class="card">
            <div class="inventory-header">
                <h2>Current Inventory</h2>
                <button onclick="loadInventory()">Refresh</button>
            </div>

            <div id="inventory-list"></div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
